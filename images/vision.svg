  <circle cx="500" cy="130" r="58" fill="#fffaf0" stroke="#e6d9bf" stroke-width="3"/><circle cx="500" cy="130" r="40" fill="#d98b73"/>
  <g fill="#f1b9a4"><circle cx="488" cy="122" r="5"/><circle cx="508" cy="116" r="5"/><circle cx="500" cy="140" r="6"/><circle cx="520" cy="136" r="4"/><circle cx="482" cy="140" r="4"/></g>
