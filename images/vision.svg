  <g><circle cx="190" cy="500" r="42" fill="#f2c94c"/><circle cx="190" cy="500" r="34" fill="#fbe58a"/><g stroke="#f2c94c" stroke-width="3"><path d="M190 466v68M156 500h68M166 476l48 48M214 476l-48 48"/></g></g>
