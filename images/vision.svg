  <circle cx="330" cy="170" r="84" fill="#fffaf0" stroke="#e6d9bf" stroke-width="3"/><circle cx="330" cy="170" r="64" fill="#e3b873"/>
  <g fill="#c98f45"><ellipse cx="310" cy="160" rx="14" ry="9"/><ellipse cx="345" cy="150" rx="14" ry="9" transform="rotate(30 345 150)"/><ellipse cx="330" cy="190" rx="14" ry="9" transform="rotate(-20 330 190)"/><ellipse cx="300" cy="190" rx="12" ry="8"/></g>
