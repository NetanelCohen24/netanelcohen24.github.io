  <g fill="#b99a66"><ellipse cx="150" cy="168" rx="9" ry="22" transform="rotate(12 150 168)"/><ellipse cx="136" cy="196" rx="8" ry="20" transform="rotate(-10 136 196)"/><ellipse cx="163" cy="200" rx="8" ry="20" transform="rotate(26 163 200)"/><ellipse cx="190" cy="198" rx="9" ry="22" transform="rotate(10 190 198)"/><ellipse cx="178" cy="228" rx="8" ry="20" transform="rotate(-12 178 228)"/><ellipse cx="204" cy="230" rx="8" ry="20" transform="rotate(24 204 230)"/></g>
  <!-- cutting board -->
  <g transform="rotate(-8 430 420)"><rect x="330" y="300" width="190" height="270" rx="26" fill="#c79a63"/><rect x="330" y="300" width="190" height="270" rx="26" fill="none" stroke="#a97c48" stroke-width="3"/><circle cx="425" cy="322" r="9" fill="#e9dcc3"/>
    <g fill="#fffaf0" stroke="#e6d9bf" stroke-width="2"><rect x="370" y="380" width="46" height="46" rx="6"/><rect x="430" y="400" width="46" height="46" rx="6"/><rect x="380" y="448" width="46" height="46" rx="6"/><rect x="440" y="468" width="46" height="46" rx="6"/></g></g>
